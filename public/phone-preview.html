<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>心动日常 · 手机预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#414737;font-family:"Microsoft YaHei",sans-serif}header{max-width:1040px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #e5e3d8}a{color:inherit;text-decoration:none;font-size:13px}strong{font-family:serif;font-size:22px;font-weight:400;letter-spacing:3px}main{display:flex;justify-content:center;padding:32px 20px;gap:45px;align-items:flex-start}aside{width:220px;padding-top:24px}small{color:#909782;font-size:10px;letter-spacing:2px}h1{font-family:serif;font-size:27px;font-weight:400;line-height:1.6}p{font-size:13px;line-height:1.9;color:#858a7e}nav{display:flex;gap:6px;margin:25px 0}button{border:1px solid #e2e3d7;background:#fffdf7;color:#697359;border-radius:18px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#798565;color:white;border-color:#798565}.phone{background:#333c31;padding:9px;border-radius:30px;box-shadow:0 18px 60px #555b3320;overflow:hidden;flex:none}iframe{display:block;border:0;border-radius:22px;width:390px;height:844px;background:#f6f4ef}aside a{display:block;margin:18px 0;color:#697359}@media(max-width:760px){header{padding:18px}header a{display:none}main{display:block;padding:20px 8px}aside{width:auto;padding:0;text-align:center}aside h1{margin:10px}aside p{display:none}nav{justify-content:center;margin:15px}aside a{display:none}.phone{max-width:100%;width:max-content;margin:auto}iframe{max-width:calc(100vw - 34px)}}
  </style>
</head>
<body><header><a href="/">✧ 心动日常</a><strong>掌心里的小世界</strong><a href="/artbook.html">角色与动作设定集 ↗</a></header><main><aside><small>A LITTLE WORLD IN YOUR HAND</small><h1>在竖屏里，<br>和她一起生活。</h1><p>选择屏幕大小，体验手机里的日常。点底部「伙伴」选择角色，点舞台右上角换装。</p><nav aria-label="屏幕大小"><button data-width="320" data-height="568" aria-pressed="false">小屏</button><button data-width="390" data-height="844" aria-pressed="true">标准</button><button data-width="430" data-height="932" aria-pressed="false">大屏</button></nav><p id="screen-size" aria-live="polite">390 × 844</p><a href="/">打开完整游戏 ↗</a><a href="/artbook.html">收藏她的每一种造型 ↗</a></aside><div class="phone"><iframe src="/" title="手机竖屏游戏"></iframe></div></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.querySelector('#screen-size').textContent=button.dataset.width+' × '+button.dataset.height;document.querySelectorAll('button[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));</script></body>
</html>
